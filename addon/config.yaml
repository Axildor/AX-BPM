# AX BPM Analyzer add-on configuration.
# The add-on announces itself to Home Assistant via the Supervisor
# discovery API (POST /services/discovery, service "ax_bpm") at startup,
# so the integration learns the real resolvable hostname + port instead
# of guessing. Port 8099 stays host-mapped for external-analyzer mode
# (non-Supervisor installs reach it via homeassistant.local:8099).
name: AX BPM Analyzer
version: "1.0.3"
slug: ax_bpm_analyzer
description: Tempo and mood analyzer for the AX BPM integration (aubio + ONNX)
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
# hassio_api: required for the Supervisor discovery POST at startup.
hassio_api: true
homeassistant_api: false
ports:
  8099/tcp: 8099
options:
  api_token: ""
  max_analyze_seconds: 60
  intra_op_threads: 2
schema:
  api_token: str?
  max_analyze_seconds: int(5,300)?
  intra_op_threads: int(1,8)?
image: ghcr.io/axildor/ax-bpm-{arch}-analyzer
