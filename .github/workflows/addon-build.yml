# Add-on build: amd64 + aarch64 via hassio addon-builder.
name: addon-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "analyzer/**"
      - "repository.json"
      - ".github/workflows/addon-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # packages: write — the default GITHUB_TOKEN needs this to push the
    # built add-on images to ghcr.io. The builder action forwards the
    # runner's docker credentials, so no PAT secret is required.
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # The hassio builder uses the --target dir as the docker build
      # context, but addon/Dockerfile COPYs repo-root-relative paths
      # (analyzer/, addon/run.sh, pytest.ini). Assemble a self-contained
      # staging dir replicating that layout.
      - name: Assemble self-contained build context
        run: |
          mkdir -p addon-build-context/addon
          cp addon/Dockerfile addon-build-context/
          cp addon/config.yaml addon-build-context/
          cp addon/run.sh addon-build-context/addon/
          cp -r analyzer addon-build-context/analyzer
          cp pytest.ini addon-build-context/

      # The builder action mounts the runner's ~/.docker into its
      # container, so the push target (ghcr.io, from the image: key in
      # addon/config.yaml) must be logged in on the runner first.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }}
        # 2026.02.1 = latest release whose ghcr.io builder image exists
        # (2026.06.0 action resolves but its builder image is "manifest unknown").
        uses: home-assistant/builder@2026.02.1
        with:
          # Modern builder syntax: explicit platform flag + --target (the
          # add-on directory name inside the repo, not a path). No --test:
          # the builder PUSHES to the registry named by the `image:` key in
          # addon/config.yaml (ghcr.io/axildor/ax-bpm-{arch}-analyzer),
          # authenticated via the runner's GITHUB_TOKEN docker login.
          # Publishing happens on every push to main; the add-on version in
          # config.yaml gates what users get.
          args: |
            --${{ matrix.arch }} \
            --target addon-build-context

  # Runtime-image hygiene probe: the hassio builder runs its build inside
  # its own container, so the image is not inspectable on the runner after
  # the build job. This job rebuilds the SAME addon/Dockerfile with plain
  # docker (identical staging context) and asserts the published image
  # contains NO dev dependencies (pytest/ruff/httpx) — the acceptance
  # evidence for the stage-order fix. amd64 only (the dev-leak defect was
  # arch-independent; aarch64 is covered by the build job above).
  probe-runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble self-contained build context
        run: |
          mkdir -p addon-build-context/addon
          cp addon/Dockerfile addon-build-context/
          cp addon/config.yaml addon-build-context/
          cp addon/run.sh addon-build-context/addon/
          cp -r analyzer addon-build-context/analyzer
          cp pytest.ini addon-build-context/

      - name: Build runtime image (amd64)
        run: docker build -f addon/Dockerfile -t axbpm-probe:amd64 addon-build-context

      - name: Record image size
        run: docker image inspect axbpm-probe:amd64 --format '{{.Size}} bytes'

      - name: Probe — dev deps must be ABSENT from the runtime image
        run: |
          set -e
          echo "== pip list (runtime image) =="
          docker run --rm axbpm-probe:amd64 pip list
          echo "== asserting dev deps absent =="
          if docker run --rm axbpm-probe:amd64 python -c "import pytest" 2>/dev/null; then
            echo "DEFECT: pytest importable in the runtime image"; exit 1
          fi
          if docker run --rm axbpm-probe:amd64 python -c "import ruff" 2>/dev/null; then
            echo "DEFECT: ruff importable in the runtime image"; exit 1
          fi
          if docker run --rm axbpm-probe:amd64 python -c "import httpx" 2>/dev/null; then
            echo "DEFECT: httpx importable in the runtime image"; exit 1
          fi
          if docker run --rm axbpm-probe:amd64 test -d /usr/src/axbpm/analyzer/tests; then
            echo "DEFECT: test suite present in the runtime image"; exit 1
          fi
          echo "PROBE PASS: no dev deps, no test suite in the runtime image"