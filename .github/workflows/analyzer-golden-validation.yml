# Tier 3 — AUTHORITATIVE analyzer golden validation (glibc).
# Mirrors the phase0 job: ubuntu-latest, Python 3.12, pinned requirements.
# HARD asserts: onnxruntime importable, AXBPM_REQUIRE_ONNX=1, ZERO skips
# in the golden + contrastive test files (any skip = job failure).
# Model cache keyed on the model-pin manifest hash; weights NEVER committed.
#
# System deps: the golden-test conftest resamples via ctypes on the system
# libsamplerate (essentia MonoLoader replication) — ubuntu-latest does not
# ship it, so it is installed explicitly below.
#
# PERMANENT PR GATE: pull_request triggers run the golden gates + the
# contrastive gate on EVERY PR (initialized by the 2026-10-07 Tier 3
# mood-degeneracy closeout run).
name: analyzer-golden-validation

on:
  push:
    branches: [main]
    paths:
      - "analyzer/**"
      - "tests/**"
      - ".github/workflows/analyzer-golden-validation.yml"
  pull_request:
    paths:
      - "analyzer/**"
      - "tests/**"
      - ".github/workflows/analyzer-golden-validation.yml"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode (logs, no gate enforcement)"
        type: boolean
        default: false

jobs:
  golden-validation:
    runs-on: ubuntu-latest
    env:
      AXBPM_REQUIRE_ONNX: "1"
      # aubio tempo tests hard-fail when aubio is missing (zero-skip).
      AXBPM_REQUIRE_TEMPO: "1"
      AXBPM_CI_MODEL_DIR: ${{ github.workspace }}/.axbpm-models
      # API tests install their own stubbed engine; without this the app
      # lifespan would try to bootstrap /data (not writable by the runner
      # user). The golden tests build their own ModelManager explicitly.
      AXBPM_SKIP_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache model weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .axbpm-models
          key: axbpm-models-${{ hashFiles('analyzer/ax_bpm_analyzer/config.py') }}

      - name: Install system deps (libsamplerate + ffmpeg)
        # libsamplerate0: the golden-test conftest resamples via ctypes on
        # the system lib (essentia MonoLoader replication).
        # ffmpeg: TEST TOOLING ONLY — the integration decode-chain tests
        # exercise the INTEGRATION copy's ffmpeg tier (kept: HA core ships
        # the binary; the analyzer copy has no ffmpeg tier — per-runtime
        # asymmetry, owner decision 2026-10-07).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsamplerate0 ffmpeg

      - name: Install pinned dependencies
        # CFLAGS: aubio 0.4.9 predates numpy 2's const-qualified ufunc
        # signature; GCC 14 makes the resulting -Wincompatible-pointer-
        # types a hard error (GCC 13 on ubuntu-24.04 only warns). Keep
        # the downgrade explicit so a runner GCC bump cannot break CI.
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          # aubio is source-only (no wheels on PyPI): its setup.py build
          # needs numpy headers + setuptools IN-ENV, so pre-build it
          # WITHOUT isolation before requirements-dev pulls the pin.
          pip install numpy==2.5.3 setuptools wheel
          pip install --no-cache-dir --no-build-isolation aubio==0.4.9
          pip install -r analyzer/requirements-dev.txt
          # Integration suite: the conftest stubs homeassistant but not the
          # other third-party modules the integration imports at module level.
          pip install aiohttp==3.14.3 voluptuous==0.16.0

      - name: HARD assert — onnxruntime importable
        run: python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"

      - name: HARD assert — AXBPM_REQUIRE_ONNX set
        run: |
          if [ "$AXBPM_REQUIRE_ONNX" != "1" ]; then
            echo "AXBPM_REQUIRE_ONNX must be 1"; exit 1
          fi

      - name: Run analyzer test suite (zero skips in golden files)
        run: |
          set -o pipefail
          pytest analyzer/tests -ra -v 2>&1 | tee pytest-analyzer.log
          # Zero-skip guard: golden + tempo files must have NO skipped
          # tests (AXBPM_REQUIRE_TEMPO=1 makes a missing aubio a failure,
          # never a skip).
          if grep -E "test_frontend_goldens|test_inference_goldens|test_tempo" pytest-analyzer.log | grep -q "SKIPPED"; then
            echo "FATAL: skipped tests in golden/tempo files — vacuous pass"; exit 1
          fi

      - name: Run integration test suite
        run: pytest tests -ra -q

      - name: Summary
        if: always()
        run: tail -20 pytest-analyzer.log || true

  # Tier 3 contrastive gate: the three §2 mood-degeneracy previews through
  # the REAL pipeline (ORT + aubio), asserting the pre-registered P4/P5/P6
  # predictions. Preview AUDIO is fetched at runtime from the anonymous
  # Deezer API by track ID (public identifiers, committed in the test) and
  # cached here — cache ≠ commit, the audio is NEVER in the repo. A fetch
  # failure FAILS the job (anti-vacuum: never a skip).
  contrastive-gate:
    runs-on: ubuntu-latest
    env:
      AXBPM_REQUIRE_ONNX: "1"
      AXBPM_REQUIRE_TEMPO: "1"
      AXBPM_CI_MODEL_DIR: ${{ github.workspace }}/.axbpm-models
      AXBPM_SKIP_BOOTSTRAP: "1"
      AXBPM_CONTRASTIVE_CACHE_DIR: ${{ github.workspace }}/.axbpm-previews
      AXBPM_CONTRASTIVE_OUT: ${{ github.workspace }}/gate-numbers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache model weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .axbpm-models
          key: axbpm-models-${{ hashFiles('analyzer/ax_bpm_analyzer/config.py') }}

      - name: Cache contrastive previews
        id: preview-cache
        uses: actions/cache@v4
        with:
          path: .axbpm-previews
          # Keyed on the track-ID set: a track change re-fetches; the
          # previews themselves are runtime artifacts, never committed.
          key: axbpm-previews-3802592782-68976286-3155839

      - name: Install system deps (libsamplerate + ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsamplerate0 ffmpeg

      - name: Install pinned dependencies
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          pip install numpy==2.5.3 setuptools wheel
          pip install --no-cache-dir --no-build-isolation aubio==0.4.9
          pip install -r analyzer/requirements-dev.txt

      - name: HARD assert — onnxruntime importable
        run: python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"

      - name: Run contrastive gate (zero skips allowed)
        run: |
          set -o pipefail
          pytest analyzer/tests/test_contrastive_gate.py -ra -v 2>&1 | tee pytest-contrastive.log
          if grep -q "SKIPPED" pytest-contrastive.log; then
            echo "FATAL: skipped tests in the contrastive gate — vacuous pass"; exit 1
          fi

      - name: Upload gate numbers artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrastive-gate-numbers
          path: gate-numbers/contrastive_gate_numbers.json
          if-no-files-found: warn
